name: "Experiment: scip-dotnet on eShop (throwaway)"

# One-off validation, NOT part of the permanent CI surface: run scip-dotnet
# against the same dotnet/eShop checkout used by the C# benchmark and inspect
# the resulting SCIP index with graphlens-rust's existing (language-agnostic)
# decoder, to decide whether a CsharpScipResolver is worth building before
# writing one. Manual dispatch only. Delete this file once the question is
# answered either way.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/csharp-realizacija-c1l9s7

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install scip-dotnet
        run: |
          dotnet tool install --global scip-dotnet
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Clone dotnet/eShop
        run: git clone --depth 1 https://github.com/dotnet/eShop.git /tmp/eshop

      - name: Pre-warm the NuGet cache via the known-good project subset
        # Best-effort only: warms shared package downloads so scip-dotnet's own
        # internal restore (below) mostly hits cache. A non-zero exit here is
        # fine and expected -- eShop.Web.slnf is not why we run this.
        working-directory: /tmp/eshop
        continue-on-error: true
        run: dotnet restore eShop.Web.slnf

      - name: Run scip-dotnet against the whole solution (its own restore)
        # Pass eShop.slnx as ONE argument -> scip-dotnet calls
        # MSBuildWorkspace.OpenSolutionAsync once (not OpenProjectAsync in a
        # loop). Passing the 21 individual .csproj as separate positional args
        # instead crashes with "'EventBusRabbitMQ' is already part of the
        # workspace" -- ScipProjectIndexer.IndexProject has no try/catch around
        # OpenProjectAsync, so a project pulled in transitively by an earlier
        # argument's ProjectReference graph collides when passed again as its
        # own top-level argument. OpenSolutionAsync does not have that failure
        # mode: it walks the whole graph in one call. It also does not need
        # --skip-dotnet-restore -- scip-dotnet's own Restore() never checks the
        # restore process's exit code, so the 3 unrestorable MAUI projects
        # (HybridApp, ClientApp, ClientApp.UnitTests) degrade to a warning
        # rather than aborting the run.
        working-directory: /tmp/eshop
        run: |
          scip-dotnet index eShop.slnx --output /tmp/eshop/index.scip
          ls -la /tmp/eshop/index.scip

      - name: Analyze the produced SCIP index
        run: |
          python3 - <<'PY'
          # Inlined copy of graphlens_rust._scip's decoder (pure stdlib, zero
          # deps) -- importing the real module drags in graphlens_rust's
          # __init__.py -> _adapter.py -> the core `graphlens` package, which
          # isn't installed in this throwaway job. Logic is identical.
          SCIP_ROLE_DEFINITION = 0x1
          _WIRE_VARINT, _WIRE_I64, _WIRE_LEN, _WIRE_I32 = 0, 1, 2, 5
          _INDEX_DOCUMENTS = 2
          _DOC_RELATIVE_PATH, _DOC_OCCURRENCES = 1, 2
          _OCC_RANGE, _OCC_SYMBOL, _OCC_ROLES = 1, 2, 3

          def _read_varint(buf, i):
              shift = result = 0
              while True:
                  byte = buf[i]; i += 1
                  result |= (byte & 0x7F) << shift
                  if not byte & 0x80:
                      return result, i
                  shift += 7

          def _iter_fields(buf):
              i, n = 0, len(buf)
              while i < n:
                  tag, i = _read_varint(buf, i)
                  fn, wt = tag >> 3, tag & 0x7
                  if wt == _WIRE_VARINT:
                      value, i = _read_varint(buf, i)
                      yield fn, wt, value
                  elif wt == _WIRE_LEN:
                      length, i = _read_varint(buf, i)
                      yield fn, wt, buf[i:i + length]; i += length
                  elif wt == _WIRE_I64:
                      yield fn, wt, buf[i:i + 8]; i += 8
                  elif wt == _WIRE_I32:
                      yield fn, wt, buf[i:i + 4]; i += 4
                  else:
                      raise ValueError(f"unsupported wire type {wt}")

          def _packed_varints(buf):
              out, i, n = [], 0, len(buf)
              while i < n:
                  v, i = _read_varint(buf, i)
                  out.append(v)
              return out

          class ScipOccurrence:
              __slots__ = ("symbol", "roles", "start_line", "start_col")
              def __init__(self, symbol, roles, start_line, start_col):
                  self.symbol, self.roles = symbol, roles
                  self.start_line, self.start_col = start_line, start_col

          def _parse_occurrence(buf):
              symbol, roles, range_ints = "", 0, []
              for fn, wt, value in _iter_fields(buf):
                  if fn == _OCC_RANGE:
                      if wt == _WIRE_LEN:
                          range_ints.extend(_packed_varints(value))
                      elif wt == _WIRE_VARINT:
                          range_ints.append(value)
                  elif fn == _OCC_SYMBOL and wt == _WIRE_LEN:
                      symbol = value.decode("utf-8", "replace")
                  elif fn == _OCC_ROLES and wt == _WIRE_VARINT:
                      roles = value
              if len(range_ints) < 2:
                  return None
              return ScipOccurrence(symbol, roles, range_ints[0], range_ints[1])

          def _parse_document(buf):
              rel_path, occurrences = "", []
              for fn, wt, value in _iter_fields(buf):
                  if fn == _DOC_RELATIVE_PATH and wt == _WIRE_LEN:
                      rel_path = value.decode("utf-8", "replace")
                  elif fn == _DOC_OCCURRENCES and wt == _WIRE_LEN:
                      occ = _parse_occurrence(value)
                      if occ is not None:
                          occurrences.append(occ)
              return rel_path, occurrences

          def iter_documents(data):
              for fn, wt, value in _iter_fields(data):
                  if fn == _INDEX_DOCUMENTS and wt == _WIRE_LEN:
                      yield _parse_document(value)

          data = open("/tmp/eshop/index.scip", "rb").read()
          print(f"index.scip size: {len(data):,} bytes")

          docs = 0
          total_occ = 0
          def_occ = 0
          empty_symbol_occ = 0
          symbols = set()
          # symbol -> (defining top-level project dir, set of referencing project dirs)
          def_project = {}
          ref_projects = {}

          def top_project(rel_path):
              parts = rel_path.split("/")
              # eShop layout: src/<Project>/... or tests/<Project>/...
              return "/".join(parts[:2]) if len(parts) >= 2 else rel_path

          for rel, occurrences in iter_documents(data):
              docs += 1
              proj = top_project(rel)
              for occ in occurrences:
                  total_occ += 1
                  if not occ.symbol:
                      empty_symbol_occ += 1
                      continue
                  symbols.add(occ.symbol)
                  if occ.roles & SCIP_ROLE_DEFINITION:
                      def_occ += 1
                      def_project.setdefault(occ.symbol, proj)
                  else:
                      ref_projects.setdefault(occ.symbol, set()).add(proj)

          print(f"documents: {docs}")
          print(f"total occurrences: {total_occ:,}")
          print(f"definition occurrences: {def_occ:,}")
          print(f"occurrences with empty symbol: {empty_symbol_occ:,}")
          print(f"distinct non-empty symbols: {len(symbols):,}")

          cross_project_symbols = 0
          examples = []
          for sym, def_proj in def_project.items():
              refs = ref_projects.get(sym, set())
              other = refs - {def_proj}
              if other:
                  cross_project_symbols += 1
                  if len(examples) < 15:
                      examples.append((sym, def_proj, sorted(other)))

          print(f"symbols defined in one project AND referenced from a DIFFERENT project: {cross_project_symbols}")
          print("\n--- sample cross-project resolutions ---")
          for sym, def_proj, other in examples:
              print(f"  defined in {def_proj:30} referenced from {other}  {sym[:100]}")

          print("\n--- sample of 20 distinct non-local symbols ---")
          non_local = [s for s in symbols if not s.startswith("local ")][:20]
          for s in non_local:
              print(f"  {s}")
          PY

      - name: Upload the raw index for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eshop-scip-dotnet-index
          path: /tmp/eshop/index.scip
          if-no-files-found: warn
