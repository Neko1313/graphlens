name: Benchmark

# Two independent uses of the same load-benchmark script:
#
# - `resolve-langs` / `benchmark` / `benchmark-render` (workflow_dispatch and
#   push to main): `resolve-langs` decides which languages to benchmark this
#   run — every language on a manual `workflow_dispatch`, or only the
#   language(s) whose adapter changed since the previous commit on a `push`
#   (via paths-filter, same idea as `pr-changes` below). `benchmark` is then
#   a per-language matrix — N parallel jobs against the published image,
#   each analysing only the projects tagged for its language — so one slow
#   or hung language can no longer block or dominate a single giant job, and
#   an unrelated commit no longer re-benchmarks every language.
#   `benchmark-render` downloads the results of whichever languages just ran,
#   overlays them onto the JSON result files already committed under
#   `benchmarks/results/` (the persisted baseline for languages that did
#   *not* run this time), re-renders the full `## Benchmarks` table in
#   README.md from that merged set, and commits both. Report-only — it
#   never gates a release. Re-run it by hand from Actions (workflow_dispatch)
#   after a release when you want every language's numbers refreshed at once.
# - `pr-changes` / `pr-benchmark` (pull_request): the same per-language
#   matrix shape, run from the PR's own source (not the published image),
#   that only benchmarks the language(s) whose adapter changed in the PR.
#   Report-only, posted to the job summary — never touches README or
#   pushes anywhere.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to benchmark (e.g. latest or 0.5.0)"
        default: "latest"
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  # Pinned so PHP benchmark numbers stay comparable run-to-run instead of
  # drifting with whatever intelephense shipped that day.
  INTELEPHENSE_VERSION: "1.18.5"
  # Same idea for the C# resolvers: pin the .NET SDK channel, scip-dotnet
  # (CsharpScipResolver, the adapter's default engine) and csharp-ls
  # (CsharpLspResolver, the alternative engine) so numbers stay comparable.
  # csharp-ls 0.25 targets .NET 10.
  DOTNET_VERSION: "10.0.x"
  CSHARP_LS_VERSION: "0.25.0"
  SCIP_DOTNET_VERSION: "0.2.14"

jobs:
  resolve-langs:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      # JSON array of language names to benchmark this run, e.g.
      # `["python","php"]` — consumed directly by `benchmark`'s matrix.
      langs: ${{ steps.resolve.outputs.langs }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            python:
              - "packages/graphlens-python/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            typescript:
              - "packages/graphlens-typescript/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            go:
              - "packages/graphlens-go/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            rust:
              - "packages/graphlens-rust/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            php:
              - "packages/graphlens-php/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            csharp:
              - "packages/graphlens-csharp/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"

      - name: Resolve language list
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'langs=["python","typescript","go","rust","php","csharp"]' >> "$GITHUB_OUTPUT"
          else
            echo 'langs=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: resolve-langs
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      needs.resolve-langs.outputs.langs != '[]'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One language's run can be re-dispatched without waiting on the others.
    concurrency:
      group: benchmark-${{ matrix.lang }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.resolve-langs.outputs.langs) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve image tag
        id: img
        run: |
          tag="${{ github.event.inputs.image_tag || 'latest' }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/neko1313/graphlens:${tag}" >> "$GITHUB_OUTPUT"
          echo "Benchmarking image ghcr.io/neko1313/graphlens:${tag} (${{ matrix.lang }})"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (waits for the release build to finish)
        run: |
          image="${{ steps.img.outputs.image }}"
          attempts=20
          for attempt in $(seq 1 "$attempts"); do
            if docker pull "$image"; then
              echo "Pulled $image"
              exit 0
            fi
            echo "Attempt ${attempt}/${attempts}: $image not pullable yet" \
                 "(a concurrent release image build may still be running)," \
                 "waiting 45s…"
            sleep 45
          done
          echo "::error::$image never became available — is the image" \
               "published? (docker.yml publishes on release / manual dispatch)"
          exit 1

      - name: Run benchmarks for ${{ matrix.lang }}
        run: |
          image="${{ steps.img.outputs.image }}"
          rm -rf benchmarks/results
          mkdir -p benchmarks/results
          mapfile -t projects < <(python3 benchmarks/run_benchmarks.py list --lang "${{ matrix.lang }}")
          if [[ ${#projects[@]} -eq 0 ]]; then
            echo "No benchmark projects tagged for ${{ matrix.lang }} — nothing to run"
            exit 0
          fi
          echo "Projects: ${projects[*]}"
          for name in "${projects[@]}"; do
            safe="${name//\//__}"
            echo "::group::benchmark ${name}"
            # Bound each project so one hung resolver can't burn the whole job
            # or lose the other results (report-only: a miss just omits a row).
            timeout --signal=TERM 1500 docker run --rm \
              -v "$PWD:/repo" -w /repo \
              --entrypoint python \
              "$image" \
              benchmarks/run_benchmarks.py analyze \
                --project "$name" \
                --manifest /repo/benchmarks/projects.json \
                --workdir /tmp/bench \
                --out "/repo/benchmarks/results/${safe}.json" \
              || echo "::warning::benchmark for ${name} failed or timed out"
            echo "::endgroup::"
          done

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.lang }}
          path: benchmarks/results/

  benchmark-render:
    needs: benchmark
    # Aggregate + refresh README even if one language's matrix leg failed —
    # a missing language just omits its rows, per the report-only contract.
    # `needs.benchmark.result` is 'skipped' when resolve-langs found nothing
    # to benchmark (e.g. a push that touched neither an adapter nor
    # benchmarks/**) — nothing changed, so there's nothing to render either.
    if: always() && needs.benchmark.result != 'skipped'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two README refreshes against main at once, and never cancel
    # one midway.
    concurrency:
      group: benchmark-render
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          tag="${{ github.event.inputs.image_tag || 'latest' }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download this run's per-language results
        uses: actions/download-artifact@v6
        with:
          pattern: benchmark-results-*
          path: benchmarks/results
          merge-multiple: true

      - name: Render results
        run: |
          # benchmarks/results/ now holds: the JSON already committed from
          # the last full/partial run (checked out above, one file per
          # project) overlaid with this run's fresh files for whichever
          # languages resolve-langs picked — so unrun languages keep their
          # last-known numbers instead of dropping out of the table.
          python3 benchmarks/run_benchmarks.py render \
            --results benchmarks/results \
            --readme README.md \
            --image-tag "${{ steps.img.outputs.tag }}"
          {
            echo "## graphlens benchmark — ${{ steps.img.outputs.tag }}"
            echo
            python3 benchmarks/run_benchmarks.py render \
              --results benchmarks/results \
              --image-tag "${{ steps.img.outputs.tag }}" \
              --print
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/

      - name: Commit refreshed README + results to main
        run: |
          if git diff --quiet -- README.md benchmarks/results; then
            echo "README and results unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md benchmarks/results
          git commit -m "docs(bench): refresh benchmark metrics for ${{ steps.img.outputs.tag }} [skip ci]"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Pushed README update"
              exit 0
            fi
            echo "Push failed, rebasing and retrying…"
            git pull --rebase origin main || true
            sleep "$((2 ** i))"
          done
          echo "::error::could not push README update to main"
          exit 1

  pr-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      # dorny/paths-filter's `changes` output is already a JSON array of the
      # filter names below that matched, e.g. `["python","php"]` — exactly
      # the matrix `pr-benchmark` needs, no extra glue required.
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - "packages/graphlens-python/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            typescript:
              - "packages/graphlens-typescript/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            go:
              - "packages/graphlens-go/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            rust:
              - "packages/graphlens-rust/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            php:
              - "packages/graphlens-php/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"
            csharp:
              - "packages/graphlens-csharp/**"
              - "benchmarks/**"
              - ".github/workflows/bench.yml"

  pr-benchmark:
    needs: pr-changes
    if: github.event_name == 'pull_request' && needs.pr-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: bench-pr-${{ github.event.pull_request.number }}-${{ matrix.lang }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.pr-changes.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        if: matrix.lang == 'go'
        with:
          go-version: "1.26"

      - name: Install gopls (semantic resolver)
        if: matrix.lang == 'go'
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install rust-analyzer (semantic resolver)
        if: matrix.lang == 'rust'
        run: |
          rustup component add rust-analyzer
          echo "$(dirname "$(rustup which rust-analyzer)")" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        if: matrix.lang == 'php'
        with:
          node-version: "20"

      - name: Cache npm downloads for intelephense
        if: matrix.lang == 'php'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-intelephense-${{ env.INTELEPHENSE_VERSION }}

      - name: Install intelephense (semantic resolver)
        if: matrix.lang == 'php'
        run: npm install -g "intelephense@${INTELEPHENSE_VERSION}"

      - uses: actions/setup-dotnet@v6
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install scip-dotnet (default semantic resolver)
        if: matrix.lang == 'csharp'
        run: |
          dotnet tool install --global scip-dotnet \
            --version "${SCIP_DOTNET_VERSION}"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install csharp-ls (alternative Roslyn semantic resolver)
        if: matrix.lang == 'csharp'
        run: |
          dotnet tool install --global csharp-ls \
            --version "${CSHARP_LS_VERSION}"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: task install

      - name: Run benchmarks for ${{ matrix.lang }}
        run: |
          mkdir -p benchmarks/results
          mapfile -t projects < <(python3 benchmarks/run_benchmarks.py list --lang "${{ matrix.lang }}")
          if [[ ${#projects[@]} -eq 0 ]]; then
            echo "No benchmark projects tagged for ${{ matrix.lang }} — nothing to run"
            exit 0
          fi
          echo "Projects: ${projects[*]}"
          for name in "${projects[@]}"; do
            safe="${name//\//__}"
            echo "::group::benchmark ${name}"
            timeout --signal=TERM 1200 uv run python3 benchmarks/run_benchmarks.py analyze \
              --project "$name" \
              --manifest benchmarks/projects.json \
              --workdir /tmp/bench \
              --out "benchmarks/results/${safe}.json" \
              || echo "::warning::benchmark for ${name} failed or timed out"
            echo "::endgroup::"
          done

      - name: Report results
        if: always()
        run: |
          {
            echo "## graphlens PR benchmark — ${{ matrix.lang }}"
            echo
            python3 benchmarks/run_benchmarks.py render \
              --results benchmarks/results \
              --image-tag "pr-${{ github.event.pull_request.number }}" \
              --print
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-benchmark-results-${{ matrix.lang }}
          path: benchmarks/results/
